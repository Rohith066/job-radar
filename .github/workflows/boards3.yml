name: Job Radar — Board Sweep Shard 3 (Workday verified)

on:
  schedule:
    # 4x daily at :10 — offset from all other lanes (:00, :30, :43)
    - cron: "10 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Boards per batch (default: 500)"
        required: false
        default: "500"

concurrency:
  group: boards3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run board sweep (shard 3 — workday verified-live)
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          BATCH=${{ github.event.inputs.batch_size || '500' }}
          python -m src.main --mode boards \
            --boards-csv data/boards/workday_verified_live.csv \
            --boards-batch-size $BATCH

      - name: Commit state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "chore: update boards3 state [skip ci]"
          git pull --rebase -X theirs origin main || true
          git push
